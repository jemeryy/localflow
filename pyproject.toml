[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localflow"
version = "0.3.0"
description = "Personal fully-local push-to-talk dictation for Windows (Whisper on Intel Arc via OpenVINO)"
requires-python = ">=3.11"
# Runtime deps only. Export-time tooling (optimum-intel, torch, transformers,
# nncf) is installed separately for the one-time model export (PRD §5).
dependencies = [
    "numpy",
    "scipy",
    "openvino",
    "openvino-genai",
    "soundfile",
    "soxr",
    "silero-vad",
    "onnxruntime",
    "sounddevice",
    "pynput",
    "pyperclip",
    "pydantic",
    "pystray",
    "pillow",
    "pycaw",
    "tomlkit",
]

[project.scripts]
localflow = "localflow.desktop.app:main"

[project.gui-scripts]
# Windowless launcher (no console) for shortcuts/startup — same app;
# logs go to %LOCALAPPDATA%/LocalFlow/localflow.log instead of a console.
localflow-tray = "localflow.desktop.app:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["localflow*"]
