# LocalFlow settings (FR-13). Device/model changes take effect on restart.
# Relative paths resolve against this file's directory.

hotkey = "alt+`"          # hold-to-talk combo, e.g. "alt+`", "ctrl+space", "f9"
stt_model = "parakeet"    # LIVE A/B (4 Aug): transducer on CPU - no decode
                          # loops, no silence hallucinations, frees the GPU.
                          # Flip back to "whisper" + Restart = exact v1.2
                          # baseline. See docs/parakeet-spike.md.
stt_model_dir = "models/whisper-turbo-ov"
parakeet_model_dir = "models/parakeet-tdt-0.6b-v2-onnx"
stt_language = "en"       # "en", "auto" (detect each time), or a Whisper code
                          # like "fr"/"es"/"de"/"zh"/"ja". Restart to apply.
device = "GPU"            # GPU | NPU | CPU
fallback_device = "CPU"
cache_dir = "models/ov_cache"
inject_mode = "paste"     # paste (clipboard+Ctrl+V) | type (keystrokes, slower)
restore_delay_ms = 500    # clipboard restore delay; raise it if a slow app
                          # ever pastes your OLD clipboard instead of speech
max_utterance_s = 300     # longest single hold-to-talk (seconds). Whisper
                          # stitches long audio itself, so talk for minutes;
                          # 0 = no limit. Also editable in Settings.
segment_seconds = 15      # Tier 1: past this many seconds of one hold, cut at
                          # a silence and transcribe that piece while you keep
                          # talking (short wait on release). 0 = off.
                          # 30 -> 15 (9 Aug): preview re-decodes the WHOLE
                          # window every beat on CPU, so a shorter window
                          # keeps the live stream close behind your voice.
live_typing = true        # type words into the focused app ~1-2s behind your
                          # voice, then correct the ending when you stop. Also
                          # enables tap-to-toggle (tap to start, tap to stop,
                          # Esc cancels) and blanks the keyboard while
                          # dictating. false = the v1.1 way: hold to talk, one
                          # paste on release. Also editable in Settings.
overlay_enabled = true    # Wispr-style waveform pill while recording (FR-2)
cleanup_enabled = false   # LLM cleanup: removes filler, fixes punctuation.
                          # false = NOT loaded at startup (saves ~2-3GB memory
                          # + seconds of load time); the tray toggle loads it
                          # on demand. true = always loaded and on.
cleanup_model_dir = "models/gemma-3-4b-ov"  # Gemma 3 4B int4 (9 Aug spike):
                          # fixes cloud->Claude from context, cleans filler,
                          # never answers the text. Tray toggle loads it on
                          # demand (~2.3GB GPU while on). Swap back to
                          # "models/qwen2.5-3b-ov" if it ever misbehaves.
cleanup_terms = ["Claude", "Claude Code", "CLAUDE.md", "Codex", "LocalFlow",
                 "Parakeet", "Whisper", "OpenVINO", "Qwen", "Gemma"]

# Audio cleanup BEFORE transcription (helps the quiet/noisy built-in mic most).
denoise_enabled = true    # high-pass + gentle spectral noise reduction
normalize_audio = true    # boost quiet mics toward a consistent loudness
denoise_strength = 0.25    # 0 = off, ~0.6 gentle, ~0.9 aggressive (can eat
                          # quiet speech — dial DOWN if accuracy regresses)

# Mic: sounddevice index or name substring; omit to follow the system
# default (LocalFlow auto-switches when the Windows default mic changes).
# input_device = "Samsung"

# Jargon Whisper mishears — biases transcription toward these spellings.
# Takes effect on restart. NOTE (3 Jul): a populated list degraded general
# accuracy (split/missing words) — leave empty unless a specific word is
# reliably wrong, and keep the list to 1-3 entries if so.
hot_words = []
overlay_visibility = "always"
pill_size = 1.01
vad_threshold = 0.42
auto_calibrate_minutes = 120  # idle room-noise recalibration (profile only,
                          # never moves the sliders; skips if you spoke or
                          # dictated in the last 5 min). 0 = off.
filter_hallucinations = true  # drop the stray word Whisper appends on trailing
                          # silence (uses timestamps; also stops the real last
                          # word dropping; ~2x STT time). false = faster, no fix
tts_volume = 0.8
numbers_as_digits = true  # spoken numbers -> digits ("forty seven" -> "47",
                          # "twenty six point two seven" -> "26.27"). Bare
                          # "one" stays a word. Restart to apply.

# Dictionary rules now reach the SCREEN during live typing too (9 Aug),
# not just history.
[replacements]
